- title: "Using publicly available satellite imagery and deep learning to understand economic well-being in Africa"
  authors: "Christopher Yeh, Anthony Perez, Anne Driscoll, George Azzari, <strong>Zhongyi Tang</strong>, David Lobell, Stefano Ermon, and Marshall Burke"
  venue: "Nature Communications"
  year: 2020
  details: "11, 2583"
  url: "https://www.nature.com/articles/s41467-020-16185-w"
  summary: "We combine deep learning with public daytime and nighttime satellite imagery to predict local asset wealth across sub-Saharan Africa. Trained on survey-based wealth measures, the models are evaluated on unseen locations and on changes in wealth over time."
