- title: "A New Perspective on Spatial Heterogeneity in African Development"
  authors: "Pascaline Dupas, Nicolas Suarez, and Zhongyi Tang"
  contribution_note: "All authors contributed equally."
  venue: "AEA Papers and Proceedings"
  year: 2026
  details: "116: 167–172"
  url: "https://www.aeaweb.org/articles?id=10.1257/pandp.20261090"
  summary: "We combine satellite imagery and survey data to map infrastructure access across Africa using machine learning. We then use spatial regression discontinuity to estimate the impact of national institutions on infrastructure access."
